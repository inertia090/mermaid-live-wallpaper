
name: Build Nabjaki APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Find project directory
        id: project
        shell: bash
        run: |
          PROJECT_DIR=$(find . -type f -name settings.gradle.kts -not -path '*/.gradle/*' -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle.kts not found."
            echo "Repository files:"
            find . -maxdepth 4 -type f
            exit 1
          fi

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project found at: $PROJECT_DIR"

      - name: Build APK
        run: gradle assembleDebug
        working-directory: ${{ steps.project.outputs.dir }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nabjaki-debug-apk
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
